# Key = runtime map byte (not Tiled local ID). Value = [slot name, actor kind].
# "none" means no allocation. Both electrode markers create the same actor.
[slots]
0  = ["blank", "none"]
1  = ["pad_seeker", "pad_seeker"]
2  = ["pad_small", "pad_small"]
3  = ["pad_medium", "pad_medium"]
4  = ["charge_shields", "none"]
5  = ["turret_fireball", "turret_fireball"]
6  = ["laser_turret", "none"]
7  = ["twin_laser_turret", "none"]
8  = ["charge_fuel", "none"]
9  = ["electrode", "electrode"]
10 = ["lightning", "lightning"]
11 = ["electrode_r", "electrode"]
12 = ["12", "none"]
13 = ["13", "none"]
14 = ["14", "none"]
15 = ["pad_large", "pad_large"]
16 = ["crater", "crater"]
